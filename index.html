
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARTUP STORE</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

/* HEADER */
header {
    background: #111;
    color: white;
    padding: 20px;
    text-align: center;
}

/* MENU */
nav {
    background: #222;
    display: flex;
    justify-content: center;
    padding: 10px;
}
nav a {
    color: white;
    margin: 0 15px;
    text-decoration: none;
}

/* HERO */
.hero {
    text-align: center;
    padding: 40px;
    background: #0078d7;
    color: white;
}

/* PRODOTTI */
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    text-align: center;
    padding: 10px;
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.button {
    background: #0078d7;
    color: white;
    padding: 10px;
    border: none;
    cursor: pointer;
    margin-top: 10px;
}

.button:hover {
    background: #005fa3;
}

/* FOOTER */
footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 10px;
}
</style>

</head>

<body>

<header>
    <h1>Startup Store</h1>
    <p>Compra magliette e prodotti unici</p>
</header>

<nav>
    Home
    Prodotti
    Contatti
</nav>

<div class="hero">
    <h2>Scopri la nostra collezione</h2>
    <p>Design moderni, qualità alta</p>
</div>

<section class="products">

<div class="card">
    <img src="https://picsum.photos/300/200" alt="">
    <h3>Maglietta Basic</h3>
    <p>€20</p>
    <button class="button" onclick="aggiungiCarrello('Maglietta Basic')">Compra</button>
</div>

<div class="card">
    <img src="https://picsum.photos/301/200" alt="">
    <h3>Felpa Street</h3>
    <p>€45</p>
    <button class="button" onclick="aggiungiCarrello('Felpa Street')">Compra</button>
</div>

<div class="card">
    <img src="https://picsum.photos/302/200" alt="">
    <h3>Cappello</h3>
    <p>€15</p>
    <button class="button" onclick="aggiungiCarrello('Cappello')">Compra</button>
</div>

</section>

<footer>
    <p>© 2026 Startup Store</p>
</footer>

<script>
function aggiungiCarrello(prodotto) {
    alert(prodotto + " aggiunto al carrello!");
}
</script>

</body>
</html>
